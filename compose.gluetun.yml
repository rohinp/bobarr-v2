services:
  bobarr:
    environment:
      BOBARR_TRANSMISSION_URL: http://gluetun:9091/transmission/rpc

  gluetun:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:?Set VPN_SERVICE_PROVIDER in .env}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      SERVER_COUNTRIES: ${VPN_SERVER_COUNTRIES:-}
      FIREWALL: "on"
      FIREWALL_INPUT_PORTS: 9091
      TZ: ${TZ:-Etc/UTC}
    ports:
      - ${TRANSMISSION_BIND_ADDRESS:-0.0.0.0}:${TRANSMISSION_WEB_PORT:-9091}:9091
    networks:
      - backend

  transmission:
    network_mode: service:gluetun
    networks: !reset []
    ports: !reset []
    depends_on:
      gluetun:
        condition: service_healthy
