name: bobarr

services:
  bobarr:
    build:
      context: .
    image: ${BOBARR_IMAGE:-bobarr-v2:0.1.0}
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: 3000
      BOBARR_CONFIG_DIR: /config
      BOBARR_MEDIA_DIR: /media
      BOBARR_MEDIA_ROOTS: ${BOBARR_MEDIA_ROOTS:-/media}
      BOBARR_VOLUME_ORGANIZER_MODE: cli
      BOBARR_COOKIE_SECURE: ${BOBARR_COOKIE_SECURE:-false}
      BOBARR_SHUTDOWN_TIMEOUT_MS: ${BOBARR_SHUTDOWN_TIMEOUT_MS:-15000}
      BOBARR_MASTER_KEY: ${BOBARR_MASTER_KEY:-}
      BOBARR_TRANSMISSION_USERNAME: ${TRANSMISSION_USERNAME:-bobarr}
      BOBARR_TRANSMISSION_PASSWORD: ${TRANSMISSION_PASSWORD:?Set TRANSMISSION_PASSWORD in .env}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${BOBARR_CONFIG_PATH:-./config}:/config
      - type: bind
        source: ${BOBARR_MEDIA_PATH:-./media}
        target: /media
        bind:
          create_host_path: false
    ports:
      - ${BOBARR_BIND_ADDRESS:-0.0.0.0}:${BOBARR_PORT:-3000}:3000
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/health/ready >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      transmission:
        condition: service_started
      jackett:
        condition: service_started
    networks:
      - backend

  jackett:
    image: lscr.io/linuxserver/jackett:v0.24.3073-ls38@sha256:653d879518f974b40f2ec59dc8c1d011e5293d175bf4867d7aacbbeb8ed43b28
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      AUTO_UPDATE: "false"
    volumes:
      - ${JACKETT_CONFIG_PATH:-./config/jackett}:/config
    ports:
      - ${JACKETT_BIND_ADDRESS:-0.0.0.0}:${JACKETT_PORT:-9117}:9117
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9117/UI/Dashboard >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
      TZ: ${TZ:-Etc/UTC}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8191/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  transmission:
    image: lscr.io/linuxserver/transmission:4.1.4-r0-ls370@sha256:5baf08cd73a566699f35baad3c4a84ba7d7057220566c5fb29969bf2292dc2ff
    restart: unless-stopped
    stop_grace_period: 2m
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      USER: ${TRANSMISSION_USERNAME:-bobarr}
      PASS: ${TRANSMISSION_PASSWORD:?Set TRANSMISSION_PASSWORD in .env}
      PEERPORT: ${TRANSMISSION_PEER_PORT:-51413}
      WHITELIST: 127.0.0.1,172.*.*.*,10.*.*.*,100.*.*.*,192.168.*.*
      HOST_WHITELIST: transmission,gluetun
    volumes:
      - ${TRANSMISSION_CONFIG_PATH:-./config/transmission}:/config
      # LinuxServer initializes ownership through its conventional /downloads
      # mount. The second alias keeps Bobarr's single-/media hardlink paths.
      - type: bind
        source: ${BOBARR_MEDIA_PATH:-./media}/downloads
        target: /downloads
        bind:
          create_host_path: false
      - type: bind
        source: ${BOBARR_MEDIA_PATH:-./media}/downloads
        target: /media/downloads
        bind:
          create_host_path: false
    ports:
      - ${TRANSMISSION_BIND_ADDRESS:-0.0.0.0}:${TRANSMISSION_WEB_PORT:-9091}:9091
      - ${TRANSMISSION_PEER_BIND_ADDRESS:-0.0.0.0}:${TRANSMISSION_PEER_PORT:-51413}:${TRANSMISSION_PEER_PORT:-51413}/tcp
      - ${TRANSMISSION_PEER_BIND_ADDRESS:-0.0.0.0}:${TRANSMISSION_PEER_PORT:-51413}:${TRANSMISSION_PEER_PORT:-51413}/udp
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS --user "$${USER}:$${PASS}" http://127.0.0.1:9091/transmission/web/ >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

networks:
  backend:
    internal: false
